<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pokédex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="../../global/css/style.css">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="../../global/js/script.js" defer></script>
    <script type="module" src="./js/base.js" defer></script>
</head>
<body>
    <!-- Elementos apenas para ignorar -->
    <button type="button" class="center over button btnMenu" style="display: none;">
        <span class="material-symbols-outlined">menu</span>
    </button>
    <button class="button center over closeMenu" style="display: none;">
        <span class="material-symbols-outlined">close</span>
    </button>
    </header>
    <button class="center over button backDados animate-on-scroll opacity" data-animation="tada">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <video src="" poster="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHFMkZ2n_zrAj_rdonRQydTZzPjDHqgAGk5g&s" class="headerTrailer width animate-on-scroll opacity" data-animation="slideInDown" autoplay="true" loop></video>
    <main class="mainBaseGame center over column">
        <img src="" alt="" class="logoPokemon center over animate-on-scroll opacity" data-animation="rubberBand">
        <h1 class="animate-on-scroll opacity" data-animation="fadeInDown">Description Game</h1>
        <p class="animate-on-scroll opacity" data-animation="fadeInUp"></p>
        <div class="center over buyGame width">
            <img src="" alt="" class="animate-on-scroll opacity" data-animation="fadeInLeft">
            <div class="center over column">
                <button class="button center over animate-on-scroll opacity" data-animation="fadeInRight" id="google"></button>
                <button class="button center over animate-on-scroll opacity" data-animation="fadeInRight" id="nintendo"></button>
            </div>
        </div>
        <h1>Photos Game</h1>
        <section class="center over slidePhotos width">
            
        </section>
    </main>
</body>
</html>
