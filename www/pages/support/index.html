<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="../../global/css/style.css">
    <link rel="stylesheet" href="../../global/css/resp.css">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="../../global/js/script.js" defer></script>
    <script type="module" src="./server/security.js" defer></script>
    <script type="module" src="./server/script.js" defer></script>
    <script type="module" src="./server/server.js" defer></script>
</head>
<body>
    <header class="center over width"> 
        <div class="center over pokeballHeader width"></div>
        <div class="center over btnHeader width">
            <button type="button" class="center over button btnMenu">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </header>
    <main class="center over">
        <section class="formSupport center over column width">
            <h1 class="animate-on-scroll opacity" data-animation="bounce">Support Form</h1>
            <form class="center over column width">
                <label for="" class="animate-on-scroll opacity" data-animation="fadeIn" required>Name</label>
                <input type="text" class="over width animate-on-scroll opacity name" data-animation="fadeIn" placeholder="Name">
                <label for="" class="animate-on-scroll opacity" data-animation="fadeIn" required>Email</label>
                <input type="text" class="over width animate-on-scroll opacity email" data-animation="fadeIn" placeholder="Email">
                <label for="" class="animate-on-scroll opacity" data-animation="fadeIn" required>Subject</label>
                <input type="text" class="over width animate-on-scroll opacity subject" data-animation="fadeIn" placeholder="Subject">
                <label for="" class="animate-on-scroll opacity" data-animation="fadeIn" required>Description</label>
                <textarea name="" id="" class="width animate-on-scroll opacity description" data-animation="fadeIn" placeholder="Description"></textarea>
                <button type="submit" class="center over buttonForm button width animate-on-scroll opacity" data-animation="fadeInUp">
                    <img src="../../element/pokeball.png" draggable="false" alt="Button more Pokemons">
                    Submit
                </button>
            </form>
        </section>
    </main>
    <section class="center over menu width height">
        <div class="headerMenu center over">
            <img src="../../global/icons/pokeballLogo.png" draggable="false" alt="Logo Pokeball">
            <button class="button center over closeMenu">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <nav class="center over topicosMenu">
            <ul class="center over">
                <a href="../../" class="topicMenu center over"><span class="material-symbols-outlined">home</span>Home</a >
                <a href="#" class="topicMenu center over"><img src="../../global/icons/pikachu.png" draggable="false" alt="Icon Pikachu">Gerações</a >
                <li>
                    <ul>
                        <li id="kanto">Kanto</li>
                        <li id="johto">Johto</li>
                        <li id="hoenn">Hoenn</li>
                        <li id="sinnoh">Sinnoh</li>
                        <li id="unova">Unova</li>
                        <li id="kalos">Kalos</li>
                        <li id="alola">Alola</li>
                        <li id="galar">Galar</li>
                        <li id="paldea">Paldea</li>
                    </ul>
                </li>
                <li><a href="../../pages/allGames/" class="topicMenu center over"><span class="material-symbols-outlined">gamepad</span>All Pokemon Games</a></li>
                <li><a href="../../pages/allMaps/" class="topicMenu center over"><span class="material-symbols-outlined">map</span>Pokemon Maps</a></li>
                <li><a href="../../pages/support/" class="topicMenu center over"><span class="material-symbols-outlined">support_agent</span>Support</a></li>
                <li><a href="../../pages/us/" class="topicMenu center over"><span class="material-symbols-outlined">help</span>Who Are We?</a></li>
            </ul>
        </nav>
    </section>
</body>
</html>
